<p>Captcha page</p>
@if (progress.currentChallenge; as current) {
    <p>{{ current.prompt }}</p>
    <input type="text" [(ngModel)] = "answer" />
<button (click) ="submit()">
  Submit
</button>

@if (result === 'incorrect') {
    <p>try again!</p>
}
 <div>
    <button (click)="previous()" [disabled]="!progress.canGoBack">Previous</button>
    <button (click)="next()" [disabled]="!alreadyAnswered || !progress.canGoForward">Next</button>
  </div>
}@else {
    <p>All challenges complete!</p>
}
