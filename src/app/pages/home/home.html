<main class="hero">
  <div class="hero__glow" aria-hidden="true"></div>

  <div class="hero__content">
    <span class="hero__eyebrow">🔒 Human verification</span>

    <h1 class="hero__title">
      Prove you're human.<br />
      <span class="hero__title-accent">Enjoy doing it.</span>
    </h1>

    <p class="hero__subtitle">
      Angul-It challenges you to complete a series of tasks that only a human can do. It's fun, fast, and secure.
    </p>

    <button class="btn-primary hero__cta" (click)="startChallenge()">
      Start Challenge →
    </button>
  </div>
</main>
